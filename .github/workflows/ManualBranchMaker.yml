
name: Manual Branch Maker

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v30.6
        uses: actions/checkout@v6
        with:
          ref: ccb264f33aa245aba26a9b2508a54c40041eb46e
          fetch-depth: 0
          persist-credentials: false

      - name: Create branch from v30.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            repos/${GITHUB_REPOSITORY}/git/refs \
            -f ref=refs/heads/magisk-30.6 \
            -f sha=ccb264f33aa245aba26a9b2508a54c40041eb46e
