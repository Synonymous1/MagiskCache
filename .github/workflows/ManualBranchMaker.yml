
name: Manual Branch Maker

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check token permissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/permissions/workflow
          gh api repos/${GITHUB_REPOSITORY} \
            --jq '.permissions'

      - name: Create branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            repos/${GITHUB_REPOSITORY}/git/refs \
            -f ref=refs/heads/magisk-30.6 \
            -f sha=ccb264f33aa245aba26a9b2508a54c40041eb46e
