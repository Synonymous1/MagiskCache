
name: Manual Branch Maker

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v30.6
        uses: actions/checkout@v6
        with:
          ref: ccb264f33aa245aba26a9b2508a54c40041eb46e
          fetch-depth: 0

      - name: Create magisk-30.6 branch
        run: |
          git push origin HEAD:refs/heads/magisk-30.6
