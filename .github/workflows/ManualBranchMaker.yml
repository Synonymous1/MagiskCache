
name: Manual Branch Maker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Create Magisk 30.6 branch
        env:
          GH_TOKEN: ${{ secrets.BRANCH_TOKEN }}
        run: |
          gh api \
            --method POST \
            repos/${GITHUB_REPOSITORY}/git/refs \
            -f ref=refs/heads/magisk-30.6 \
            -f sha=ccb264f33aa245aba26a9b2508a54c40041eb46e
